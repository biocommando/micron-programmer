<html>

<head>
    <title>Micron/MiniAk editor</title>
    <link rel="stylesheet" href="knobs.css">
    <style>
/* Base Styling & Eye-Strain Mitigation */
body {
    background-color: #1a1c23; /* Softer, low-strain charcoal background */
    color: #f1f3f9;            /* High-contrast crisp off-white text */
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    padding: 25px;
    margin: 0;
}

#controls {
    max-width: 1200px;
    margin: 0 auto;
    user-select: none;
    -webkit-user-select: none;
    -moz-user-select: none;
}

/* Highly Legible Headers */
h1 {
    font-size: 1.25rem;
    text-transform: uppercase;
    letter-spacing: 0.15rem;
    color: #ffb703; /* Industrial high-visibility amber gold */
    background-color: #242836; /* Distinct heading backdrop anchor */
    padding: 10px 16px;
    border-radius: 6px;
    border-left: 5px solid #ffb703;
    margin-top: 35px;
    margin-bottom: 20px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.15);
}

/* Form Controls & Dropdowns */
select, button {
    background-color: #242836;
    color: #ffffff;
    border: 2px solid #3d455c; /* Highly defined borders */
    border-radius: 6px;
    padding: 10px 16px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease-in-out;
}

select:focus, button:hover {
    border-color: #ffb703;
    outline: none;
    box-shadow: 0 0 8px rgba(255, 183, 3, 0.4);
}

button:active {
    background-color: #ffb703;
    color: #1a1c23;
}

/* Modular Enclosure Boxes */
.controls-box, .param-dropdown-container {
    display: flex;
    flex-wrap: wrap;
    gap: 24px;
    background-color: #2b3042; /* Elevated hardware chassis color */
    padding: 25px;
    border-radius: 10px;
    border: 2px solid #3d455c;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
}

/* Knob Structural Container */
.knob-container {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    width: 110px; /* Expanded slightly for legibility space */
    gap: 6px;
}

.knob-container span {
    display: block;
    user-select: none;
    -webkit-user-select: none;        
    -moz-user-select: none;
}

/* Flat/Black Knob Contrast Fix */
.knob {
    width: 49px;
    height: 49px; 
    margin: 5px 0;
    background-image: url("knob.png");
    background-size: contain;
    background-repeat: no-repeat;
    touch-action: none;
    
    /* Adds a silver aluminum high-contrast accent ring around your flat black image */
    border-radius: 50%;
    outline: 3px solid #4e5775;
    box-shadow: 0 0 0 5px #1a1c23, 0 6px 12px rgba(0,0,0,0.5);
}

/* Static Label (Moved to the very bottom via order: 2) */
.knob-title {
    color: #a0a6be;
    font-size: 11px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.05rem;
    text-align: center;
    margin-top: 4px;
    order: 2; 
}

/* Dynamic Value OLED "Screen" (Moved below the knob via order: 1) */
[id$="-label"] {
    display: block;
    width: 100%;
    box-sizing: border-box;
    background-color: #0d0e12;  /* Deep glass-black screen background */
    color: #ffb703;             /* Glowing retro-synth amber values */
    font-family: 'Courier New', Courier, monospace;
    font-size: 13px;            /* Increased size for high legibility */
    font-weight: bold;
    text-align: center;
    padding: 6px 4px;
    border-radius: 4px;
    border: 1px solid #3d455c;
    box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.8), 0 1px 0 rgba(255,255,255,0.1);
    letter-spacing: 0.02rem;
    order: 1; 
    min-height: 28px;
}

/* Param Card Modules */
.param-dropdown {
    display: inline-flex;
    flex-direction: column;
    background-color: #242836;
    border: 2px solid #3d455c;
    border-radius: 8px;
    padding: 14px;
    font-size: 11px;
    font-weight: bold;
    text-transform: uppercase;
    color: #a0a6be;
    gap: 8px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.15);
}

.param-dropdown select {
    width: 100%;
}
    </style>
</head>

<body>
    <div id="controls">
        <h1>Midi device select</h1>
        <select id="midi-device-select"
            onchange="midi.setDevice(document.getElementById('midi-device-select').value, ()=>{})"></select>
        <button onclick="clearNrpnCache()">Clear cached values</button>
        <h1>Misc</h1>
        <div class="controls-box" id="controls-misc"></div>
        <h1>Mixer</h1>
        <div class="controls-box" id="controls-lev"></div>
        <h1>Oscillator</h1>
        <div class="controls-box" id="controls-osc"></div>
        <h1>Filter</h1>
        <div class="controls-box" id="controls-filter"></div>
        <h1>Envelope</h1>
        <div class="controls-box" id="controls-env"></div>
        <h1>LFO</h1>
        <div class="controls-box" id="controls-lfo"></div>
        <h1>FX</h1>
        <div class="controls-box" id="controls-fx"></div>
        <h1>Modulation</h1>
        <div class="controls-box" id="controls-mod-matrix"></div>
        <h1>Tracking</h1>
        <div class="controls-box" id="controls-tracking"></div>
        <h1>Arpeggiator</h1>
        <div class="controls-box" id="controls-arp"></div>
    </div>
    <h1>Automation editor</h1>
    <div>
        <textarea id="automation" rows="10" cols="40">
# Drive type
drty=compressor
# Drive level
drle=0.5
        </textarea>
        <pre id="automation-output"></pre>
        <div>
            <button onclick="sendAutomation()">Execute</button>
        </div>
        <details>
            <summary>List of short names</summary>
            <pre id="short-name-list"></pre>
        </details>
    </div>
    <script src="midi.js"></script>
    <script src="knobs.js"></script>
    <script src="params-dropdown.js"></script>
    <script>
        midi.getDevices(devices => {
            let html = devices.map(dev => `<option value="${dev.name}">${dev.name}</option>`).join('')
            html = '<option>select...</option>' + html
            document.getElementById('midi-device-select').innerHTML = html
        })
        let nrpns = [], shortNames = {}
        fetch('micron-params.json')
            .then(x => x.json())
            .then(json => {
                json.parameters.forEach(param => {
                    if (typeof param.options === 'string')
                        param.options = json.optionref[param.options]
                })
                nrpns = mapNrpnParamArray(json.parameters)
                let modMatrixPatchCableIdx = 0
                nrpns.forEach(nrpn => {
                    const name = nrpn.name.toLowerCase()

                    let shortName = name
                        .replace(/\-(\d)/g, 'm $1')
                        .replace(/[^a-z0-9]/g, ' ')
                        .split(' ')
                        .map(x => x.trim())
                        .filter(Boolean)
                        .map(x => x.substr(0, 2))
                        .join('')
                    while (shortNames[shortName])
                        shortName = '_' + shortName
                    shortNames[shortName] = nrpn
                    nrpn.shortName = shortName
                    nrpn.control = {}

                    let valueFormatter = rangeFormatter(nrpn.getRange().min, nrpn.getRange().max, Math.floor)
                    if (nrpn.options)
                        valueFormatter = optionsFormatter(nrpn.options)
                    let root = 'controls-misc'
                    if (name.endsWith(' level') || name.endsWith(' balance'))
                        root = 'controls-lev'
                    if (name.startsWith('oscillator '))
                        root = 'controls-osc'
                    if (name.startsWith('filter '))
                        root = 'controls-filter'
                    if (name.startsWith('envelope '))
                        root = 'controls-env'
                    if (name.startsWith('lfo '))
                        root = 'controls-lfo'
                    if (name.startsWith('fx'))
                        root = 'controls-fx'
                    if (name.startsWith('patch '))
                        root = 'controls-mod-matrix'
                    if (name.startsWith('tracking '))
                        root = 'controls-tracking'
                    if (name.startsWith('arpeggiator '))
                        root = 'controls-arp'
                    if (name.match(/patch cable \d+? (source|destination)/)) {
                        if (name.endsWith('source'))
                            document.getElementById('controls-mod-matrix').innerHTML += `<h2>Modulation #${++modMatrixPatchCableIdx}</h2>`
                        nrpn.control.id = createParamDropdown(document.getElementById(root), name, nrpn.options, val => nrpn.send(val, x => x))
                        nrpn.control.type = 'dropdown'
                    } else {
                        nrpn.control.id = createKnob(document.getElementById(root), nrpn.name, nrpn.send, null, valueFormatter)
                        nrpn.control.type = 'knob'
                    }
                })
                document.getElementById('short-name-list').innerHTML = Object.keys(shortNames).map(shortName => {
                    return `${shortNames[shortName].name}${' '.repeat(40 - shortNames[shortName].name.length)}: ${shortName}`
                }).join('\n')
            })

        function setParamByShortName(shortName, value) {
            const nrpn = shortNames[shortName]
            if (!nrpn)
                return false
            let option = 0
            if (isNaN(Number(value))) {
                option = nrpn.options.indexOf(value)
                value = option / Math.floor(nrpn.options.length - 1)
            } else
                value = Number(value)
            nrpn.send(value)
            if (nrpn.control.type === 'knob') {
                knobState.states[nrpn.control.id].value = value
                updateKnobElement(nrpn.control.id)
            } else {
                const el = document.getElementById(nrpn.control.id)
                el.value = option
            }
            return true
        }

        function sendAutomation() {
            clearNrpnCache()
            let output = []
            document.getElementById('automation-output').innerHTML = 'Executing...'
            document.getElementById('automation').value
                .split('\n').map(x => x.trim()).filter(x => x !== '' && x[0] !== '#')
                .forEach(x => {
                    const [param, value] = x.split('=').map(x => x.trim())
                    if (value !== undefined) {
                        output.push(`set ${value} -> ${param}`)
                        if (!setParamByShortName(param, value))
                            output.push('Unknown parameter name')
                    }
                    else {
                        output.push('Parsing error: ' + x)
                    }
                })
            setTimeout(() => {
                document.getElementById('automation-output').innerHTML = output.join('\n')
            }, 200)
        }

        // Clearing cache might be needed if values have been manually changed on Micron
        function clearNrpnCache() {
            nrpns.forEach(x => x.clearCache())
        }
    </script>
</body>

</html>
